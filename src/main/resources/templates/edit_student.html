<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Edit Student</title>

<style>

/* Background */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}

/* Title */
h2 {
    text-align: center;
    color: white;
    margin-top: 30px;
}

/* Form Card */
form {
    background: white;
    padding: 30px;
    margin: 40px auto;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: left;
}

/* Labels */
label {
    font-weight: bold;
    color: #333;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #4facfe;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

/* Hover */
button:hover {
    background: #00c6ff;
}

/* Back Button */
.back-btn {
    display: block;
    width: 220px;
    margin: 20px auto;
    text-align: center;
    padding: 12px;
    background: white;
    color: #4facfe;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.back-btn:hover {
    background: #4facfe;
    color: white;
}

/* Responsive */
@media (max-width: 600px) {
    form {
        width: 90%;
    }
}

</style>

</head>

<body>

<h2>👨‍🎓 Edit Student Details</h2>

<form th:action="@{/updateStudent}" method="post" th:object="${student}">

    <input type="hidden" th:field="*{id}"/>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required>

    <label>Parent Name:</label>
    <input type="text" th:field="*{parentName}" required>

    <label>Address:</label>
    <input type="text" th:field="*{address}" required>

    <label>Class:</label>
    <input type="text" th:field="*{studentClass}" required>

    <label>Section:</label>
    <input type="text" th:field="*{section}" required>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required>

    <label>Phone:</label>
    <input type="text" th:field="*{phoneNumber}" pattern="[0-9]{10}" required>

    <button type="submit">Update Student</button>

</form>

<a href="/students" class="back-btn">⬅ Back to Student List</a>

</body>
</html>
