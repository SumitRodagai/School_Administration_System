<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Edit Schedule</title>

<style>

/* Background */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}

/* Title */
h2 {
    text-align: center;
    color: white;
    margin-top: 40px;
}

/* Form Card */
form {
    background: white;
    padding: 30px;
    width: 320px;
    margin: 40px auto;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: left;
}

/* Labels */
label {
    font-weight: bold;
    color: #333;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #4facfe;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

/* Hover */
button:hover {
    background: #00c6ff;
}

/* Back Button */
.back-btn {
    display: block;
    width: 200px;
    margin: 20px auto;
    text-align: center;
    padding: 12px;
    background: white;
    color: #4facfe;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.back-btn:hover {
    background: #4facfe;
    color: white;
}

/* Responsive */
@media (max-width: 600px) {
    form {
        width: 90%;
    }
}

</style>

</head>

<body>

<h2>📘 Edit Schedule</h2>

<form th:action="@{/updateSchedule}" th:object="${schedule}" method="post">

    <input type="hidden" th:field="*{id}" />

    <label>Class:</label>
    <input type="text" th:field="*{className}" required>

    <label>Subject:</label>
    <select th:field="*{subject}">
        <option th:each="s : ${subjects}"
                th:value="${s.subject}"
                th:text="${s.subject}">
        </option>
    </select>

    <label>Teacher Name:</label>
    <input type="text" th:field="*{teacherName}" required>

    <button type="submit">Update Schedule</button>

</form>

<a href="/scheduleList" class="back-btn">⬅ Back to List</a>

</body>
</html>
