<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>School Reports</title>

<style>

/* Background */
body{
    font-family: Arial;
    background: linear-gradient(to right, #74ebd5, #acb6e5);
    text-align:center;
}

/* Container */
.container{
    background:white;
    width:70%;
    margin:auto;
    margin-top:50px;
    padding:30px;
    border-radius:12px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

/* Title */
h1{
    margin-bottom:30px;
}

/* Cards layout */
.cards{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

/* Card */
.card{
    background:#f8f9fa;
    padding:25px;
    width:220px;
    border-radius:10px;
    box-shadow:0px 3px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

/* Links */
.card a{
    text-decoration:none;
    color:#007bff;
    font-weight:bold;
    font-size:16px;
}

/* Icons (optional look) */
.icon{
    font-size:30px;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 School Reports</h1>

<div class="cards">

<!-- Student Report -->
<div class="card">
<div class="icon">🎓</div>
<a href="/studentReport">Student Admission Report</a>
</div>

<!-- Attendance -->
<div class="card">
<div class="icon">📅</div>
<a href="/attendanceReport">Attendance Report</a>
</div>

<!-- Performance -->
<div class="card">
<div class="icon">📈</div>
<a href="/performanceReport">Student Performance Report</a>
</div>

<!-- Fees -->
<div class="card">
<div class="icon">💰</div>
<a href="/feeReport">Fee Payment Report</a>
</div>

</div>

<br><br>

<a href="/index">
<button style="padding:10px 20px; background:black; color:white; border:none; border-radius:5px;">
⬅ Back to Dashboard
</button>
</a>

</div>

</body>
</html>
