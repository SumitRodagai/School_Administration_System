<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Student Admission</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}

/* Center container */
.container {
    width: 400px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* Title */
h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
}

/* Labels */
label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
    color: #555;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    transition: 0.3s;
}

/* Input focus effect */
input:focus {
    border-color: #4facfe;
    outline: none;
    box-shadow: 0 0 5px #4facfe;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

/* Hover effect */
button:hover {
    transform: scale(1.05);
}

/* Responsive */
@media (max-width: 500px) {
    .container {
        width: 90%;
    }
}

</style>

</head>

<body>

<div class="container">

<h2>Student Admission Form</h2>

<form th:action="@{/saveStudent}" th:object="${student}" method="post">

<label>Name</label>
<input type="text" th:field="*{name}" required />

<label>Parent Name</label>
<input type="text" th:field="*{parentName}" required />

<label>Address</label>
<input type="text" th:field="*{address}" required />

<label>Class</label>
<input type="text" th:field="*{studentClass}" required />

<label>Section</label>
<input type="text" th:field="*{section}" required />

<label>Email</label>
<input type="email" th:field="*{email}" required />

<label>Phone Number</label>
<input type="text" th:field="*{phoneNumber}" required />

<button type="submit">Save Student</button>

</form>

</div>

</body>
</html>
