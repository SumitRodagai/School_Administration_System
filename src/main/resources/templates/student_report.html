<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Student Report</title>

<style>

/* Background */
body{
    font-family: Arial;
    background: linear-gradient(to right, #74ebd5, #acb6e5);
    text-align:center;
}

/* Container */
.container{
    background:white;
    width:80%;
    margin:auto;
    margin-top:40px;
    padding:30px;
    border-radius:12px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

/* Table */
table{
    border-collapse:collapse;
    width:100%;
    margin-top:20px;
}

th, td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}

/* Row hover */
tr:hover{
    background:#f5f5f5;
}

/* Button */
.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:black;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.back-btn:hover{
    background:#333;
}

</style>

</head>

<body>

<div class="container">

<h2>🎓 Student Admission Report</h2>

<table>

<tr>
<th>Name</th>
<th>Class</th>
<th>Section</th>
</tr>

<tr th:each="s : ${students}">
<td th:text="${s.name}"></td>
<td th:text="${s.studentClass}"></td>
<td th:text="${s.section}"></td>
</tr>

</table>

<br>

<a href="/reports" class="back-btn">
⬅ Back to Reports
</a>

</div>

</body>
</html>
