<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Student List</title>

<style>

/* Background */
body{
    font-family: Arial;
    background: linear-gradient(to right, #74ebd5, #acb6e5);
    text-align:center;
}

/* Container */
.container{
    background:white;
    width:90%;
    margin:auto;
    margin-top:40px;
    padding:30px;
    border-radius:12px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

/* Table */
table{
    border-collapse:collapse;
    width:100%;
    margin-top:20px;
}

th, td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}

/* Hover */
tr:hover{
    background:#f5f5f5;
}

/* Buttons */
a{
    padding:6px 12px;
    text-decoration:none;
    border-radius:5px;
    color:white;
    font-size:14px;
}

.edit{
    background:orange;
}

.delete{
    background:red;
}

/* Top Buttons */
.top-btn{
    display:inline-block;
    margin:10px;
    padding:10px 20px;
    border-radius:5px;
    text-decoration:none;
    color:white;
}

.add{
    background:#28a745;
}

.back{
    background:black;
}

/* 🔍 Search Bar */
.search-box{
    margin-top:20px;
}

.search-box input{
    padding:8px;
    width:250px;
    border-radius:5px;
    border:1px solid #ccc;
}

.search-box button{
    padding:8px 12px;
    border:none;
    border-radius:5px;
    background:#007bff;
    color:white;
    cursor:pointer;
}

.reset-btn{
    background:gray;
}

</style>

</head>

<body>

<div class="container">

<h2>🎓 Students List</h2>

<!-- Top Buttons -->
<a href="/admission" class="top-btn add">➕ Add New Student</a>
<a href="/index" class="top-btn back">⬅ Back to Dashboard</a>

<!-- 🔍 SEARCH FORM -->
<div class="search-box">
    <form action="/searchStudent" method="get">
        <input type="text" name="name" placeholder="Enter student name" required>

        <button type="submit">Search</button>

        <a href="/students">
            <button type="button" class="reset-btn">Reset</button>
        </a>
    </form>
</div>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Parent</th>
<th>Address</th>
<th>Class</th>
<th>Section</th>
<th>Email</th>
<th>Phone</th>
<th>Action</th>
</tr>

<tr th:each="student : ${students}">

<td th:text="${student.id}"></td>
<td th:text="${student.name}"></td>
<td th:text="${student.parentName}"></td>
<td th:text="${student.address}"></td>
<td th:text="${student.studentClass}"></td>
<td th:text="${student.section}"></td>
<td th:text="${student.email}"></td>
<td th:text="${student.phoneNumber}"></td>

<td>

<a class="edit"
   th:href="@{/editStudent/{id}(id=${student.id})}">
   Edit
</a>

<a class="delete"
   th:href="@{/deleteStudent/{id}(id=${student.id})}"
   onclick="return confirm('Are you sure you want to delete this student?')">
   Delete
</a>

</td>

</tr>

</table>

<!-- ❌ NO DATA MESSAGE -->
<p style="color:red; margin-top:15px;"
   th:if="${#lists.isEmpty(students)}">
   No students found
</p>

</div>

</body>
</html>
