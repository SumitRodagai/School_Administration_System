<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Student Performance</title>

<style>

/* Background */
body{
    font-family: Arial;
    background: linear-gradient(to right, #74ebd5, #acb6e5);
    text-align:center;
}

/* Card container */
.container{
    background:white;
    width:70%;
    margin:auto;
    margin-top:40px;
    padding:30px;
    border-radius:12px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

/* Input */
input{
    padding:8px;
    width:200px;
}

/* Table */
table{
    border-collapse: collapse;
    width:100%;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}

/* Button */
button{
    padding:10px 20px;
    margin-top:15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

/* Link Button */
.link-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#28a745;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.link-btn:hover{
    background:#218838;
}

</style>

</head>

<body>

<div class="container">

<h2>📊 Student Performance Entry</h2>

<form th:action="@{/savePerformance}" method="post">

Student ID:
<br>
<input type="text" name="studentId" placeholder="Enter Student ID" required>

<br><br>

<table>

<tr>
<th>Subject</th>
<th>Marks</th>
</tr>

<tr th:each="s : ${subjects}">

<td>
<input type="hidden" name="subject" th:value="${s.subject}">
<span th:text="${s.subject}"></span>
</td>

<td>
<input type="number" name="marks" min="0" max="100" placeholder="0-100" required>
</td>

</tr>

</table>

<button type="submit">💾 Save All Marks</button>

</form>

<br>

<!-- View Performance -->
<a href="/performanceReport" class="link-btn">
📄 View Performance Report
</a>

</div>

</body>
</html>
